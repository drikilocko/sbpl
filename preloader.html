<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preloader SBPL | Premium</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: url('4.webp') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Overlay Sombre */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1;
        }

        .preloader-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
            animation: loadProgress 8s forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; animation-timing-function: cubic-bezier(0.8, 0, 0.2, 1); }
            30% { width: 60%; animation-timing-function: linear; }
            70% { width: 75%; animation-timing-function: cubic-bezier(0.8, 0, 0.2, 1); }
            100% { width: 100%; }
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.65rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 40px;
        }

        .start-btn {
            display: inline-block;
            padding: 12px 35px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px);
            animation: revealBtn 0.5s ease 8s forwards;
            transition: all 0.3s ease;
        }

        @keyframes revealBtn {
            to { opacity: 1; transform: translateY(0); }
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="preloader-container">
        <div class="loading-text">CHARGEMENT SBPL</div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <button class="start-btn" onclick="alert('Chargement terminé !')">COMMENCER</button>
    </div>
</body>
</html>
