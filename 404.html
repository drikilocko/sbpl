<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Introuvable | SBPL</title>
    <meta name="description" content="Page introuvable — SBPL Garage Premium" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --red: #ff0000;
            --dark: #000;
            --white: #fff;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--dark);
            color: var(--white);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        /* ── GRAIN ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.035;
            pointer-events: none;
            z-index: 0;
        }

        /* ── AMBIENT GLOW ── */
        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: pulse 6s ease-in-out infinite alternate;
        }
        .glow-1 {
            width: 500px; height: 500px;
            background: rgba(255, 0, 0, 0.12);
            top: -100px; left: -100px;
        }
        .glow-2 {
            width: 400px; height: 400px;
            background: rgba(255, 0, 0, 0.07);
            bottom: -80px; right: -80px;
            animation-delay: -3s;
        }
        @keyframes pulse {
            from { opacity: 0.6; transform: scale(1); }
            to   { opacity: 1;   transform: scale(1.15); }
        }

        /* ── WRAPPER ── */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0;
            padding: 40px 20px;
            text-align: center;
        }

        /* ── 404 GIANT ── */
        .four-o-four {
            font-size: clamp(8rem, 25vw, 22rem);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.06em;
            background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.05) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            animation: fadeInDown 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Red accent line under 404 */
        .four-o-four::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--red);
            border-radius: 2px;
            animation: expandLine 1s 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes expandLine {
            from { width: 0; opacity: 0; }
            to   { width: 60px; opacity: 1; }
        }

        /* ── LABEL ── */
        .label {
            margin-top: 32px;
            font-size: clamp(0.65rem, 1.5vw, 0.85rem);
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--red);
            animation: fadeIn 0.8s 0.4s ease both;
        }

        /* ── MESSAGE ── */
        .message {
            margin-top: 16px;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 300;
            color: rgba(255,255,255,0.45);
            max-width: 420px;
            line-height: 1.6;
            animation: fadeIn 0.8s 0.6s ease both;
        }

        /* ── BUTTONS ── */
        .actions {
            display: flex;
            gap: 16px;
            margin-top: 48px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeIn 0.8s 0.8s ease both;
        }

        .btn {
            padding: 14px 36px;
            border-radius: 50px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--red);
            color: var(--white);
            border: 1px solid var(--red);
        }
        .btn-primary:hover {
            background: #cc0000;
            border-color: #cc0000;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255,0,0,0.35);
        }

        .btn-ghost {
            background: transparent;
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-ghost:hover {
            border-color: rgba(255,255,255,0.6);
            transform: translateY(-2px);
        }

        /* ── LOGO ── */
        .logo {
            position: fixed;
            top: 30px;
            left: 40px;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--white);
            text-decoration: none;
            z-index: 10;
            animation: fadeIn 0.6s ease both;
        }
        .logo em { color: var(--red); font-style: normal; }

        /* ── SCAN LINE ── */
        .scan {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,0,0,0.6), transparent);
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 5;
        }
        @keyframes scan {
            0%   { top: -2px; opacity: 0; }
            5%   { opacity: 1; }
            95%  { opacity: 1; }
            100% { top: 100vh; opacity: 0; }
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .logo { top: 20px; left: 20px; }
            .actions { gap: 12px; }
            .btn { padding: 13px 28px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- Ambient -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="scan"></div>

    <!-- Logo -->
    <a href="index.html" class="logo">SB<em>PL</em></a>

    <!-- Main content -->
    <div class="container">
        <div class="four-o-four">404</div>

        <span class="label">Erreur — Page introuvable</span>

        <p class="message">
            La page que vous cherchez n'existe pas ou a été déplacée.<br>
            Retournez à l'accueil pour continuer votre expérience.
        </p>

        <div class="actions">
            <a href="index.html" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <path d="M3 12L12 3l9 9M5 10v10h5v-6h4v6h5V10"/>
                </svg>
                Accueil
            </a>
            <a href="shop/boutique.html" class="btn btn-ghost">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0"/>
                </svg>
                Boutique
            </a>
        </div>
    </div>

</body>
</html>
